spring.application.name=budgeting
spring.jpa.show-sql=true

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

spring.jpa.hibernate.ddl-auto=update

# Modelo para chamadas de Texto / Chat (chatModel.call)
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# Modelo para transcrição de Áudio (audioTranscriptionModel.call)
spring.ai.openai.audio.transcription.options.model=whisper-large-v3-turbo
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=text
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro.\
áudio contém descrição de gastos financeiros. \
  as frases geralmente contém : \
  -um valor em reais (número + reais) \
  - uma ação (gastei, comprei) \
  - um local ou estabelecimento (mercado, padaria, restaurante)

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.options.model=canopylabs/orpheus-v1-english
spring.ai.openai.audio.speech.options.voice=diana
spring.ai.openai.audio.speech.options.response-format=wav



